# Atualiza web/data.json com os focos do NASA FIRMS das últimas 24 h, a cada 3 horas.
# O FIRMS não deixa o navegador ler os arquivos direto (sem CORS), então esta tarefa baixa, processa
# (web/tools/build_live.py) e grava a cópia no repositório. O painel mostra quando ela foi feita.
name: FIRMS 24 h

on:
  schedule:
    - cron: "17 */3 * * *"      # minuto 17 de cada 3 h (UTC); o FIRMS atualiza os arquivos várias vezes ao dia
  workflow_dispatch: {}          # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

concurrency:
  group: firms-24h
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # As malhas do IBGE ficam no repositório: o servidor do IBGE não responde às máquinas do GitHub (fora do Brasil).
      - name: Baixar e processar o FIRMS
        run: python3 -I web/tools/build_live.py web/data.json --cache web/tools/ibge-malhas

      # Previsão do próximo mês para o gestor (web/forecast.html): histórico 2004–2021 + os focos que acabaram de chegar.
      - name: Refazer a previsão do próximo mês
        run: python3 -I web/tools/build_forecast.py web/forecast.json

      - name: Gravar no repositório se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json web/forecast.json
          if git diff --cached --quiet; then
            echo "Sem mudança nos dados."
          else
            git commit -m "data: focos do NASA FIRMS (24 h) e previsão do próximo mês de $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
